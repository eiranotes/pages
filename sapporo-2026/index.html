<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fb">
<title>삿포로 9/12–15 일정</title>
<meta name="description" content="2026년 9월 12–15일 삿포로 여행 일정과 날짜별 Google Maps 실제 이동 경로">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="mast">
    <div><h1>삿포로 9/12–15</h1></div>
    <div class="mast-meta">
      <span><b>ICN 09:00 → CTS</b>9월 12일</span>
      <span><b>CTS 11:00 → ICN</b>9월 15일</span>
    </div>
  </header>

  <nav class="day-tabs" aria-label="날짜 선택"><div class="day-tabs-inner" id="tabs"></div></nav>

  <section class="day-head">
    <div><small id="dayEyebrow">SEP 12 · SAT</small><h2 id="dayTitle"></h2></div>
    <div class="day-sub" id="daySub"></div>
  </section>

  <section class="map-section" aria-label="날짜별 Google Maps 이동 경로">
    <div class="map-tools">
      <div class="map-title-block">
        <b>Google Maps · 실제 도로 경로</b>
        <span id="routeNote"></span>
      </div>
      <div class="map-actions">
        <button id="resetMap">경로 다시 보기</button>
        <button id="airportRoute" hidden>공항 이동</button>
        <button id="googleRoute" class="primary">Google Maps에서 열기</button>
      </div>
    </div>
    <div class="route-variants" id="routeVariants" hidden aria-label="13일 분리 동선"></div>
    <div class="map-wrap">
      <iframe id="routeMapFrame" title="Google Maps 날짜별 실제 이동 경로" loading="eager" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <div class="map-note"><span>지도 언어: 한국어 · 도심 일정은 도보 경로 기준</span><span id="routeCount"></span></div>
  </section>

  <section class="schedule">
    <div class="schedule-bar"><h3>일정</h3><span class="schedule-progress" id="scheduleProgress"></span></div>
    <ol class="schedule-list" id="scheduleList"></ol>
  </section>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
