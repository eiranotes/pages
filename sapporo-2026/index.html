<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fb">
<title>삿포로 9/12–15 일정</title>
<meta name="description" content="2026년 9월 12–15일 삿포로 여행 일정과 날짜별 도심 이동 지도">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="mast">
    <div><h1>삿포로 9/12–15</h1></div>
    <div class="mast-meta">
      <span><b>ICN 09:00 → CTS</b>9월 12일</span>
      <span><b>CTS 11:00 → ICN</b>9월 15일</span>
    </div>
  </header>

  <nav class="day-tabs" aria-label="날짜 선택"><div class="day-tabs-inner" id="tabs"></div></nav>

  <section class="day-head">
    <div><small id="dayEyebrow">SEP 12 · SAT</small><h2 id="dayTitle"></h2></div>
    <div class="day-sub" id="daySub"></div>
  </section>

  <section class="map-section" aria-label="날짜별 이동 지도">
    <div class="map-tools">
      <div class="map-legend" id="legend">
        <span class="legend-item"><i class="legend-line"></i>예정</span>
        <span class="legend-item"><i class="legend-line done"></i>완료</span>
      </div>
      <div class="map-actions">
        <button id="resetMap">도심 전체</button>
        <button id="googleRoute" class="primary">Google 경로</button>
      </div>
    </div>
    <div class="map-wrap">
      <div id="routeMap"></div>
      <div class="empty-map" id="mapFallback">지도를 불러오지 못했습니다. Google 경로 버튼을 사용하세요.</div>
    </div>
    <div class="map-note"><span id="routeNote"></span><span id="routeCount"></span></div>
  </section>

  <section class="schedule">
    <div class="schedule-bar"><h3>일정</h3><span class="schedule-progress" id="scheduleProgress"></span></div>
    <ol class="schedule-list" id="scheduleList"></ol>
  </section>
</div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
